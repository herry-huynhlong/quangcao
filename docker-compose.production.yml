services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qavio_ads
      POSTGRES_USER: qavio_ads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - qavio_ads_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qavio_ads -d qavio_ads"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - qavio_ads_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${QAVIO_ADS_API_IMAGE:-ghcr.io/herry-huynhlong/qavio-ads-api:latest}
    restart: unless-stopped
    command: ["sh", "-c", "cd apps/api && node dist/database/migrate.js && cd ../.. && node apps/api/dist/main.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://qavio_ads:${POSTGRES_PASSWORD}@postgres:5432/qavio_ads
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3201:4000"

  web:
    image: ${QAVIO_ADS_WEB_IMAGE:-ghcr.io/herry-huynhlong/qavio-ads-web:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3200:3000"

volumes:
  qavio_ads_postgres:
  qavio_ads_redis:
