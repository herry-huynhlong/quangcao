services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qavio_ads
      POSTGRES_USER: qavio_ads
      POSTGRES_PASSWORD: change-local-password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qavio_ads -d qavio_ads"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  redis_data:
